<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANAS WEB DESIGNER | Contact</title>
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #111827; --accent: #00f2fe; --text-main: #f3f4f6; --text-muted: #9ca3af; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
        header { background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(10px); padding: 20px 0; border-bottom: 1px solid rgba(0, 242, 254, 0.2); position: sticky; top: 0; z-index: 100; text-align: center; }
        .logo { font-size: 28px; font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; text-shadow: 0 0 10px var(--accent); }
        nav a { color: var(--text-muted); text-decoration: none; margin: 0 15px; font-weight: 600; transition: 0.3s; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        nav a:hover, nav a.active { color: var(--accent); text-shadow: 0 0 8px var(--accent); }
        
        .container { max-width: 800px; margin: 80px auto; padding: 40px; background: var(--card-bg); border-radius: 15px; border: 1px solid #1f2937; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        /* Neon tech border line top */
        .container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
        
        h1 { font-size: 36px; margin-bottom: 10px; color: #fff; }
        .address { font-size: 18px; color: var(--text-muted); margin-bottom: 40px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .btn-group { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        
        .btn-whatsapp { display: flex; align-items: center; justify-content: center; gap: 10px; width: 80%; max-width: 400px; background: #25D366; color: white; padding: 15px 30px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 18px; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-whatsapp:hover { background: #1ebe57; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4); }
        
        .btn-review { background: #1f2937; border: 1px solid var(--accent); color: var(--accent); }
        .btn-review:hover { background: rgba(0, 242, 254, 0.1); box-shadow: 0 10px 25px rgba(0, 242, 254, 0.2); }

        footer { text-align: center; padding: 30px; background: var(--card-bg); border-top: 1px solid #1f2937; margin-top: 50px; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="logo">MANAS WEB DESIGNER</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h1>Get in Touch</h1>
        <div class="address">
            📍 <span>near RK international, Baripada, Odisha 757001</span>
        </div>
        
        <p style="color: var(--text-muted); margin-bottom: 30px;">Reach out directly via WhatsApp for appointments or to share your feedback about our services.</p>
        
        <div class="btn-group">
            <!-- Book Appointment -->
            <a href="https://wa.me/919437197191?text=Hello%20Manas,%20I%20want%20to%20book%20an%20appointment." class="btn-whatsapp" target="_blank">
                💬 Book Appointment
            </a>
            
            <!-- Give Review -->
            <a href="https://wa.me/919437197191?text=Hi%20Manas,%20here%20is%20my%20review%20for%20your%20service:%20" class="btn-whatsapp btn-review" target="_blank">
                ⭐ Leave a Review
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 MANAS WEB DESIGNER. All rights reserved.</p>
    </footer>

</body>
</html>
